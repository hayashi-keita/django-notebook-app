databases:
  - name: mysitedb
    plan: free
    databaseName: mydb
    user: keita
service:
  - type: web
    plan: free
    name: school-project
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn school_project.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 4