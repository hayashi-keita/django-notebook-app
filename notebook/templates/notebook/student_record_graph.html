{% extends 'base.html' %}

{% block title %}評価グラフ{% endblock %}

{% block contents %}
<div class="container mt-4">
    <h1 class="mb-4">日々の評価推移</h1>
    <p class="text-muted">過去 {{ total_records }} 日分の体調とメンタルの推移です。</p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div style="height: 400px;">
                <canvas id=recordChart></canvas>
            </div>
        </div>
    </div>

    <div class="text-center">
        <a href="{% url 'notebook:student_record_list' %}" class="btn btn-secondary">
            <i class="fas fa-list"></i> 一覧に戻る
        </a>
    </div>
</div>
{% endblock %}

{% block script %}
<!-- Chart.js CDN (グラフ描画ライブラリ) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script>
    const dates = {{ dates_json | safe }}
    const physicalLevels = {{ physical_levels_json | safe }}
    const mentalLevels = {{ mental_levels_json | safe }}

    if (dates.length === 0) {
        document.getElementById('recordChart').parentElement.innerHTML = '<p class="text-center text-danger mt-5">表示する記録データがありません。</p>';
    } else {
        const ctx = document.getElementById('recordChart').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: '体調レベル',
                        data: physicalLevels,
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        tension: 0.3,
                        fill: false,
                    },
                    {
                        label: 'メンタルレベル',
                        data: mentalLevels,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        tension: 0.3,
                        fill: false,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '体調・メンタル 10段階評価推移',
                        font: { size: 16 }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                },
                scales: {
                    x: {
                        title: {
                            dislay: true,
                            text: '日付'
                        }
                    },
                    y: {
                        title: {
                            dislay: true,
                            text: '評価レベル（1-10）'
                        },
                        min: 1,
                        max: 10,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    }
</script>
{% endblock %}
