<!-- templates/notebook/notification_list.html -->
{% extends 'base.html' %}

{% block title %}通知一覧{% endblock %}

{% block contents %}
<div class="container mt-4">
    <h2>通知一覧</h2>
    <ul class="list-group">
        {% for obj in object_list %}
        <li class="list-group-item {% if not obj.is_read %}fw-bold{% endif %}">
            {{ obj.message }}
            <small class="text-muted float-end">{{ obj.created_at|date:"Y-m-d H:i" }}</small>
        </li>
        {% empty %}
        <li class="list-group-item">通知はありません。</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
